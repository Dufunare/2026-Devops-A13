name: E8-E10 teaching validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    name: e8e10-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build teaching environment
        shell: bash
        run: |
          set -euo pipefail
          # Match the E7 runner adaptation: keep the pinned digest, use Docker Hub in CI.
          PINNED_BASE=$(sed -n 's/^ARG BASE_IMAGE=//p' labs/e8e10/environment/services/buildchecker/Dockerfile)
          test -n "$PINNED_BASE"
          CANONICAL_BASE="${PINNED_BASE/m.daocloud.io\/docker.io\//docker.io\/}"
          mkdir -p work/ci
          git rev-parse HEAD > work/ci/commit.txt
          printf '%s\n' "$CANONICAL_BASE" > work/ci/base-image-source.txt
          docker build --build-arg BASE_IMAGE="$CANONICAL_BASE" -f labs/e8e10/environment/services/buildchecker/Dockerfile -t course-e8e10:ci labs/e8e10/environment
      - name: Validate both tracks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 -m unittest discover -s labs/e8e10 -p test_profile.py -v
          for track in A B; do
            for stage in e8 e9 e10; do
              docker run --rm --network none --cap-add SYS_PTRACE --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 labs/e8e10/lab.py "$stage" --track "$track" --out "/course/work/$track-$stage"
            done
          done
      - name: Validate A13 independent transitive-header case
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-add SYS_PTRACE \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PYTHONPATH=/course/labs/e8e10:/app \
            -v "$PWD:/course" -w /course course-e8e10:ci \
            python3 scripts/e8e10/run_extension_241830088.py /course/work/ci/A13-transitive
      - name: Audit archived A13 course-server evidence
        shell: bash
        run: |
          set -euo pipefail
          CLOUD=evidence/E8-E10/241830088/cloud
          python3 scripts/e8e10/verify_a_241830088.py \
            --e8 "$CLOUD/e8-A-manual.2CB9OL" \
            --e9 "$CLOUD/e9-A-manual.ov6Rix" \
            --e10 "$CLOUD/e10-A-manual.Og3Upd" \
            --extension "$CLOUD/e10-A-transitive-20261103-102412" \
            --out work/ci/A13-cloud-audit
          sha256sum -c evidence/E8-E10/241830088/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e8e10-evidence-${{ github.run_id }}
          path: work/
          retention-days: 14
