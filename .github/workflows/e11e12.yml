name: E11-E12 integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, e11-e12-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: e11e12-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure CI identity and environment
        run: |
          git config --local user.name 999999999
          git config --local user.email ci@example.invalid
          docker build --build-arg DOCKER_CLI_IMAGE=docker:28.5.1-cli@sha256:9190b0613792e658a7783cf14b2d5ace5941bb68ede7276922ea36ee457d76ad --build-arg BASE_IMAGE=python:3.13-slim@sha256:f82c96458eedc847b233e582eb31336f4954b39cae020b6dcf5b3ed0e5cbcd74 -f labs/e11e12/environment/services/buildchecker/Dockerfile -t course-e11e12:999999999 labs/e11e12/environment
      - name: Contracts and integration
        env:
          E11E12_USE_SOURCE_POLICY: '0'
        run: |
          python3 run_e11e12.py test
          python3 run_e11e12.py prepare
          for mode in e11-a e11-b e12; do
            python3 run_e11e12.py run --request "data/integration-sample/$mode.json" --out "work/ci-$mode"
          done
      - name: Verify A13 independent producer and immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=course-e11e12:999999999
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          docker run --rm --network none --cap-add SYS_PTRACE \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e A13_IMAGE_ID="$IMAGE_ID" \
            -e PYTHONPATH=/course/labs/e11e12:/course/labs/e8e10:/app \
            -v "$PWD:/course" -w /course "$IMAGE" \
            python3 labs/e11e12/run_a_241830088.py \
              --dataset /course/data/ci-a13-producer --out /course/work/ci-a13-producer
          for CASE in include body declaration; do
            python3 labs/e11e12/audit_a.py --run-dir "work/ci-a13-producer/$CASE" \
              --out "work/ci-a13-producer/audit-$CASE.json"
            python3 labs/e11e12/handoff.py --run-dir "work/ci-a13-producer/$CASE" \
              --repo data/ci-a13-producer/repo --source-sha "$(git rev-parse HEAD)" \
              --image-id "$IMAGE_ID" --toolchain work/ci-a13-producer/toolchain.txt \
              --out "work/ci-a13-handoff-$CASE"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e11e12-evidence-${{ github.run_id }}
          path: work/
          retention-days: 14
